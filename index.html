<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TOEIC Fixer Pro</title>

    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon.png" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TOEIC Fixer" />

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            padding-bottom: 40px;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
        }
        /* iOS Safe Area / Notch Protection for Header (Top, Left, and Right) */
        
        .glass-header {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            padding-top: calc(env(safe-area-inset-top) + 12px);
            padding-bottom: 12px;
            padding-left: calc(env(safe-area-inset-left) + 16px);
            padding-right: calc(env(safe-area-inset-right) + 16px);
        }
        
        .answer-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .answer-btn:active {
            transform: scale(0.88);
        }
        /* Independent Coexistence State Styling */
        
        .selected-normal {
            background: #2563eb !important;
            color: white !important;
            border-color: #2563eb !important;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        
        .selected-fix {
            background: #dc2626 !important;
            color: white !important;
            border-color: #dc2626 !important;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }
        /* Split-Gradient indicator for identical choices */
        
        .selected-both {
            background: linear-gradient(135deg, #2563eb 50%, #dc2626 50%) !important;
            color: white !important;
            border-color: #1e40af !important;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }
        
        .part-section {
            scroll-margin-top: calc(env(safe-area-inset-top) + 130px);
        }
        
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Printable Engine Canvas Styles (Landscape A4: 297mm x 210mm) */
        
        .pdf-landscape-page {
            width: 297mm;
            height: 210mm;
            padding: 16mm 15mm;
            background: #ffffff;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
            position: relative;
        }
        
        .pdf-bubble {
            width: 22px;
            height: 22px;
            border: 1.5px solid #94a3b8;
            border-radius: 50%;
            font-size: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #475569;
        }
        
        .pdf-bubble.filled-normal {
            background-color: #2563eb !important;
            color: white !important;
            border-color: #2563eb !important;
        }
        
        .pdf-bubble.filled-fix {
            background-color: #dc2626 !important;
            color: white !important;
            border-color: #dc2626 !important;
        }
        
        .pdf-bubble.filled-both {
            background: linear-gradient(135deg, #2563eb 50%, #dc2626 50%) !important;
            color: white !important;
            border-color: #2563eb !important;
        }
    </style>
</head>

<body class="bg-gray-50 text-slate-800 font-sans antialiased">

    <div class="sticky top-0 z-50 w-full shadow-md">

        <header class="glass-header text-white flex items-center justify-between gap-2 border-b border-slate-800/40">
            <div class="min-w-0 flex-shrink pr-1">
                <h1 class="text-base sm:text-xl font-black tracking-tight bg-gradient-to-r from-blue-400 to-indigo-200 bg-clip-text text-transparent truncate">
                    TOEIC Fixer Pro
                </h1>
                <p class="text-[9px] sm:text-xs text-slate-400 font-medium tracking-wide truncate">200 QUESTIONS</p>
            </div>

            <div class="flex items-center gap-1.5 sm:gap-2 flex-shrink-0">

                <div id="modeToggle" class="relative flex items-center bg-slate-900 p-0.5 rounded-full border border-slate-800 w-[110px] h-8 cursor-pointer select-none flex-shrink-0 transition-colors duration-200" title="Switch Mode">
                    <div id="toggleBg" class="absolute top-0.5 left-0.5 bottom-0.5 w-[52px] bg-blue-600 rounded-full transition-all duration-200 cubic-bezier(0.4, 0, 0.2, 1)"></div>
                    <div class="relative flex w-full h-full text-center text-[10px] font-black tracking-wider uppercase">
                        <span id="labelStd" class="flex-1 flex items-center justify-center text-white transition-colors duration-150">Std</span>
                        <span id="labelFix" class="flex-1 flex items-center justify-center text-slate-500 transition-colors duration-150">Fix</span>
                    </div>
                </div>

                <button onclick="exportPDF()" class="flex items-center gap-1 px-2.5 h-8 rounded-full bg-emerald-600 text-white text-[11px] font-bold shadow-md active:scale-95 transition-all duration-150 border border-emerald-500 whitespace-nowrap" title="Export Answer Sheet">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    <span>PDF</span>
                </button>

                <button onclick="clearAnswers()" class="w-8 h-8 flex-shrink-0 flex items-center justify-center rounded-full bg-slate-800 text-slate-400 hover:text-red-400 border border-slate-700 active:scale-95 transition-all duration-150" title="Clear All Answers">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                </button>
            </div>
        </header>

        <nav class="bg-slate-900 border-b border-slate-800 px-3 py-2.5 overflow-x-auto no-scrollbar">
            <div class="flex gap-2 min-w-max">
                <button onclick="scrollToPart('p1')" class="px-3.5 py-1.5 rounded-full bg-slate-800 text-slate-300 text-xs font-bold hover:bg-slate-700 transition">P1</button>
                <button onclick="scrollToPart('p2')" class="px-3.5 py-1.5 rounded-full bg-slate-800 text-slate-300 text-xs font-bold hover:bg-slate-700 transition">P2</button>
                <button onclick="scrollToPart('p3')" class="px-3.5 py-1.5 rounded-full bg-slate-800 text-slate-300 text-xs font-bold hover:bg-slate-700 transition">P3</button>
                <button onclick="scrollToPart('p4')" class="px-3.5 py-1.5 rounded-full bg-slate-800 text-slate-300 text-xs font-bold hover:bg-slate-700 transition">P4</button>
                <button onclick="scrollToPart('p5')" class="px-3.5 py-1.5 rounded-full bg-slate-800 text-slate-300 text-xs font-bold hover:bg-slate-700 transition">P5</button>
                <button onclick="scrollToPart('p6')" class="px-3.5 py-1.5 rounded-full bg-slate-800 text-slate-300 text-xs font-bold hover:bg-slate-700 transition">P6</button>
                <button onclick="scrollToPart('p7')" class="px-3.5 py-1.5 rounded-full bg-slate-800 text-slate-300 text-xs font-bold hover:bg-slate-700 transition">P7</button>
            </div>
        </nav>
    </div>

    <div id="uiViewportContainer" class="p-3 max-w-2xl mx-auto space-y-6">
        <main id="mainContainer" class="space-y-6">
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        // CONFIG
        const config = [{
            id: 'p1',
            title: 'Part 1: Photographs',
            start: 1,
            end: 6,
            options: ['A', 'B', 'C', 'D'],
            color: 'blue'
        }, {
            id: 'p2',
            title: 'Part 2: Question-Response',
            start: 7,
            end: 31,
            options: ['A', 'B', 'C'],
            color: 'blue'
        }, {
            id: 'p3',
            title: 'Part 3: Conversations',
            start: 32,
            end: 70,
            options: ['A', 'B', 'C', 'D'],
            color: 'blue'
        }, {
            id: 'p4',
            title: 'Part 4: Talks',
            start: 71,
            end: 100,
            options: ['A', 'B', 'C', 'D'],
            color: 'blue'
        }, {
            id: 'p5',
            title: 'Part 5: Incomplete Sentences',
            start: 101,
            end: 130,
            options: ['A', 'B', 'C', 'D'],
            color: 'indigo'
        }, {
            id: 'p6',
            title: 'Part 6: Text Completion',
            start: 131,
            end: 146,
            options: ['A', 'B', 'C', 'D'],
            color: 'indigo'
        }, {
            id: 'p7',
            title: 'Part 7: Reading Comprehension',
            start: 147,
            end: 200,
            options: ['A', 'B', 'C', 'D'],
            color: 'indigo'
        }];

        let isFixMode = false;
        const modeToggle = document.getElementById('modeToggle');
        const toggleBg = document.getElementById('toggleBg');
        const labelStd = document.getElementById('labelStd');
        const labelFix = document.getElementById('labelFix');
        
        // Load Registry data from localStorage with a fallback
        const answersRegistry = JSON.parse(localStorage.getItem('answersRegistry')) || {};

        // Interactive Toggle Switch Engine
        modeToggle.addEventListener('click', () => {
            isFixMode = !isFixMode;
            if (isFixMode) {
                toggleBg.style.transform = 'translateX(52px)';
                toggleBg.classList.replace('bg-blue-600', 'bg-red-600');
                labelFix.classList.replace('text-slate-500', 'text-white');
                labelStd.classList.replace('text-white', 'text-slate-500');
            } else {
                toggleBg.style.transform = 'translateX(0px)';
                toggleBg.classList.replace('bg-red-600', 'bg-blue-600');
                labelStd.classList.replace('text-slate-500', 'text-white');
                labelFix.classList.replace('text-white', 'text-slate-500');
            }
        });

        function scrollToPart(id) {
            document.getElementById(id).scrollIntoView({
                behavior: 'smooth'
            });
        }

        // Shared dynamic style manager for coexistence configurations
        function syncRowButtonUI(btnWrapper, q) {
            const buttons = btnWrapper.querySelectorAll('.answer-btn');
            buttons.forEach(btn => {
                const opt = btn.innerText;

                // Reset states
                btn.classList.remove('selected-normal', 'selected-fix', 'selected-both');

                const matchesNormal = answersRegistry[q]?.normal === opt;
                const matchesFix = answersRegistry[q]?.fix === opt;

                if (matchesNormal && matchesFix) {
                    btn.classList.add('selected-both');
                } else if (matchesNormal) {
                    btn.classList.add('selected-normal');
                } else if (matchesFix) {
                    btn.classList.add('selected-fix');
                }
            });
        }

        function createPart(part) {
            const section = document.createElement('section');
            section.id = part.id;
            section.className = 'part-section bg-white rounded-2xl shadow-sm border border-gray-200/80 overflow-hidden';
            const colorTheme = part.color === 'blue' ? 'text-blue-600' : 'text-indigo-600';

            section.innerHTML = `
                <div class="px-5 py-4 bg-gray-50/70 border-b border-gray-100 flex justify-between items-center">
                    <h2 class="text-base font-bold ${colorTheme}">${part.title}</h2>
                    <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-gray-200/60 text-gray-600">Q${part.start} - Q${part.end}</span>
                </div>
                <div class="question-list divide-y divide-gray-100"></div>
            `;

            const container = section.querySelector('.question-list');

            for (let q = part.start; q <= part.end; q++) {
                // Initialize default object values safely if missing from cache
                if (!answersRegistry[q]) {
                    answersRegistry[q] = {
                        normal: null,
                        fix: null,
                        flag: false
                    };
                }

                const row = document.createElement('div');
                row.className = 'question-row flex items-center justify-between px-5 py-3 hover:bg-slate-50/50 transition-colors';

                // Adjusted layout container: Number comes first, Flag button sits immediately to its right.
                const labelWrapper = document.createElement('div');
                labelWrapper.className = 'flex items-center gap-2 w-16';

                const label = document.createElement('div');
                label.className = 'font-bold text-sm text-gray-400';
                label.innerText = String(q).padStart(2, '0');

                const flagBtn = document.createElement('button');
                const flagColor = answersRegistry[q].flag ? 'text-yellow-500' : 'text-gray-300';
                flagBtn.className = `flag-btn ${flagColor} transition-colors focus:outline-none`;
                flagBtn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 fill-current" viewBox="0 0 24 24">
                        <path d="M4 2v20h2v-8h13l-2-4 2-4H6V2H4z"/>
                    </svg>
                `;
                
                flagBtn.addEventListener('click', () => {
                    answersRegistry[q].flag = !answersRegistry[q].flag;
                    if (answersRegistry[q].flag) {
                        flagBtn.classList.replace('text-gray-300', 'text-yellow-500');
                    } else {
                        flagBtn.classList.replace('text-yellow-500', 'text-gray-300');
                    }
                    localStorage.setItem('answersRegistry', JSON.stringify(answersRegistry));
                });
                
                labelWrapper.appendChild(label);
                labelWrapper.appendChild(flagBtn);
                row.appendChild(labelWrapper);

                const btnWrapper = document.createElement('div');
                btnWrapper.className = 'flex items-center gap-3';

                part.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'answer-btn border border-gray-300 text-gray-600 bg-white shadow-sm';
                    btn.innerText = opt;

                    btn.addEventListener('click', () => {
                        if (isFixMode) {
                            // Toggle tracking execution structure
                            answersRegistry[q].fix = (answersRegistry[q].fix === opt) ? null : opt;
                        } else {
                            answersRegistry[q].normal = (answersRegistry[q].normal === opt) ? null : opt;
                        }
                        syncRowButtonUI(btnWrapper, q);
                        localStorage.setItem('answersRegistry', JSON.stringify(answersRegistry));
                    });

                    btnWrapper.appendChild(btn);
                });

                row.appendChild(btnWrapper);
                syncRowButtonUI(btnWrapper, q); // Sync choice states matching loaded configuration
                container.appendChild(row);
            }
            return section;
        }

        const main = document.getElementById('mainContainer');
        config.forEach(part => main.appendChild(createPart(part)));

        // Interactive Clear System
        function clearAnswers() {
            if (confirm('Are you sure you want to clear all marked answers?')) {
                for (const q in answersRegistry) {
                    answersRegistry[q] = {
                        normal: null,
                        fix: null,
                        flag: false
                    };
                }
                document.querySelectorAll('.answer-btn').forEach(btn => {
                    btn.classList.remove('selected-normal', 'selected-fix', 'selected-both');
                });
                document.querySelectorAll('.flag-btn').forEach(btn => {
                    btn.classList.remove('text-yellow-500');
                    btn.classList.add('text-gray-300');
                });
                localStorage.removeItem('answersRegistry');
            }
        }

        function generateLandscapePageMarkup(startQ, endQ) {
            const container = document.createElement('div');
            container.className = 'pdf-landscape-page';
            container.style.position = 'absolute';
            container.style.left = '-9999px';
            container.style.top = '0px';

            let markup = `<div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; height: 100%;">`;

            const itemsPerColumn = 25;
            for (let c = 0; c < 4; c++) {
                markup += `<div style="display: flex; flex-direction: column; justify-content: space-between; height: 100%;">`;

                const colStart = startQ + (c * itemsPerColumn);
                const colEnd = colStart + itemsPerColumn - 1;

                for (let q = colStart; q <= colEnd; q++) {
                    if (q > endQ) break;

                    const partConfig = config.find(p => q >= p.start && q <= p.end);
                    const options = partConfig ? partConfig.options : ['A', 'B', 'C', 'D'];
                    const state = answersRegistry[q];
                    const numColor = state?.flag ? '#eab308' : '#475569';

                    markup += `
                        <div style="display: flex; align-items: center; justify-content: space-between; padding: 1.5px 0; border-bottom: 1px dotted #cbd5e1;">
                            <span style="font-size: 11px; font-weight: 800; color: ${numColor}; width: 24px;">${String(q).padStart(3, '0')}</span>
                            <div style="display: flex; gap: 8px;">
                    `;

                    options.forEach(opt => {
                        let bubbleClass = 'pdf-bubble';
                        if (state) {
                            const hasNormal = state.normal === opt;
                            const hasFix = state.fix === opt;

                            if (hasNormal && hasFix) {
                                bubbleClass += ' filled-both';
                            } else if (hasNormal) {
                                bubbleClass += ' filled-normal';
                            } else if (hasFix) {
                                bubbleClass += ' filled-fix';
                            }
                        }
                        markup += `<div class="${bubbleClass}">${opt}</div>`;
                    });

                    if (options.length === 3) {
                        markup += `<div style="width: 22px; height: 22px;"></div>`;
                    }

                    markup += `</div></div>`;
                }
                markup += `</div>`;
            }

            markup += `</div>`;
            container.innerHTML = markup;
            return container;
        }

        async function exportPDF() {
            const pdfWindow = window.open('', '_blank');
            if (!pdfWindow) {
                alert('Please allow popups to view the PDF.');
                return;
            }
            pdfWindow.document.write('<p style="font-family:sans-serif; text-align:center; margin-top:20px;">Generating your PDF matrix... Please wait.</p>');

            const {
                jsPDF
            } = window.jspdf;
            const pdf = new jsPDF({
                orientation: 'landscape',
                unit: 'mm',
                format: 'a4'
            });

            const pageDefinitions = [{
                start: 1,
                end: 100
            }, {
                start: 101,
                end: 200
            }];

            for (let i = 0; i < pageDefinitions.length; i++) {
                const def = pageDefinitions[i];
                const pageDOM = generateLandscapePageMarkup(def.start, def.end);
                document.body.appendChild(pageDOM);

                try {
                    const canvas = await html2canvas(pageDOM, {
                        scale: 2.0,
                        useCORS: true,
                        backgroundColor: '#ffffff',
                        logging: false
                    });

                    const imgData = canvas.toDataURL('image/png');
                    if (i > 0) pdf.addPage();
                    pdf.addImage(imgData, 'PNG', 0, 0, 297, 210);

                } catch (error) {
                    console.error("PDF Engine Error:", error);
                } finally {
                    document.body.removeChild(pageDOM);
                }
            }

            const blobString = pdf.output('bloburl');
            pdfWindow.location.href = blobString;
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
            });
        }
    </script>
</body>

</html>
