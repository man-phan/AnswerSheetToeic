<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TOEIC Fixer Pro</title>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon.png" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TOEIC Fixer" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            padding-bottom: 40px;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
        }
        
        .glass-header {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            height: 72px;
            /* Explicit height to sync with the sticky nav below */
        }
        
        .sticky-nav {
            top: 72px;
            /* Matches header height perfectly to prevent overlapping */
        }
        
        .answer-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .answer-btn:active {
            transform: scale(0.88);
        }
        
        .selected-normal {
            background: #2563eb !important;
            color: white !important;
            border-color: #2563eb !important;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        
        .selected-fix {
            background: #dc2626 !important;
            color: white !important;
            border-color: #dc2626 !important;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }
        
        .part-section {
            /* Added margin spacing so jumping to parts clears the sticky elements completely */
            scroll-margin-top: 140px;
        }
        /* Hide scrollbars for aesthetic navigation */
        
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-gray-50 text-slate-800 font-sans antialiased">

    <!-- HEADER BAR -->
    <header class="sticky top-0 z-50 glass-header text-white px-4 py-4 shadow-md flex items-center justify-between">
        <div>
            <h1 class="text-xl font-black tracking-tight bg-gradient-to-r from-blue-400 to-indigo-200 bg-clip-text text-transparent">
                TOEIC Fixer Pro
            </h1>
            <p class="text-xs text-slate-400 font-medium tracking-wide">COMPREHENSIVE 200 QUESTIONS</p>
        </div>

        <div class="flex items-center gap-2">
            <button id="modeToggle" class="px-4 py-2 rounded-full bg-blue-600 text-white text-xs font-bold shadow-md active:scale-95 transition-all duration-150 border border-blue-500">
                Mode: Standard
            </button>
            <button onclick="exportPDF()" class="flex items-center gap-1.5 px-4 py-2 rounded-full bg-emerald-600 text-white text-xs font-bold shadow-md active:scale-95 transition-all duration-150 border border-emerald-500" title="Export Answer Sheet">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
                <span>Export PDF</span>
            </button>
        </div>
    </header>

    <!-- HORIZONTAL TOP PART SCROLLER -->
    <nav class="sticky sticky-nav z-40 bg-slate-900 border-b border-slate-800 px-3 py-2.5 overflow-x-auto no-scrollbar shadow-md">
        <div class="flex gap-2 min-w-max">
            <button onclick="scrollToPart('p1')" class="px-3.5 py-1.5 rounded-full bg-slate-800 text-slate-300 text-xs font-bold hover:bg-slate-700 transition">P1</button>
            <button onclick="scrollToPart('p2')" class="px-3.5 py-1.5 rounded-full bg-slate-800 text-slate-300 text-xs font-bold hover:bg-slate-700 transition">P2</button>
            <button onclick="scrollToPart('p3')" class="px-3.5 py-1.5 rounded-full bg-slate-800 text-slate-300 text-xs font-bold hover:bg-slate-700 transition">P3</button>
            <button onclick="scrollToPart('p4')" class="px-3.5 py-1.5 rounded-full bg-slate-800 text-slate-300 text-xs font-bold hover:bg-slate-700 transition">P4</button>
            <button onclick="scrollToPart('p5')" class="px-3.5 py-1.5 rounded-full bg-slate-800 text-slate-300 text-xs font-bold hover:bg-slate-700 transition">P5</button>
            <button onclick="scrollToPart('p6')" class="px-3.5 py-1.5 rounded-full bg-slate-800 text-slate-300 text-xs font-bold hover:bg-slate-700 transition">P6</button>
            <button onclick="scrollToPart('p7')" class="px-3.5 py-1.5 rounded-full bg-slate-800 text-slate-300 text-xs font-bold hover:bg-slate-700 transition">P7</button>
        </div>
    </nav>

    <!-- MAIN ANSWER SHEET CONTENT -->
    <div id="pdfContent" class="p-3 max-w-2xl mx-auto space-y-6">
        <main id="mainContainer" class="space-y-6">
            <!-- JavaScript targets this area to render rows -->
        </main>
    </div>

    <!-- Script Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        // CONFIG
        const config = [{
            id: 'p1',
            title: 'Part 1: Photographs',
            start: 1,
            end: 6,
            options: ['A', 'B', 'C', 'D'],
            color: 'blue'
        }, {
            id: 'p2',
            title: 'Part 2: Question-Response',
            start: 7,
            end: 31,
            options: ['A', 'B', 'C'],
            color: 'blue'
        }, {
            id: 'p3',
            title: 'Part 3: Conversations',
            start: 32,
            end: 70,
            options: ['A', 'B', 'C', 'D'],
            color: 'blue'
        }, {
            id: 'p4',
            title: 'Part 4: Talks',
            start: 71,
            end: 100,
            options: ['A', 'B', 'C', 'D'],
            color: 'blue'
        }, {
            id: 'p5',
            title: 'Part 5: Incomplete Sentences',
            start: 101,
            end: 130,
            options: ['A', 'B', 'C', 'D'],
            color: 'indigo'
        }, {
            id: 'p6',
            title: 'Part 6: Text Completion',
            start: 131,
            end: 146,
            options: ['A', 'B', 'C', 'D'],
            color: 'indigo'
        }, {
            id: 'p7',
            title: 'Part 7: Reading Comprehension',
            start: 147,
            end: 200,
            options: ['A', 'B', 'C', 'D'],
            color: 'indigo'
        }];

        let isFixMode = false;
        const modeToggle = document.getElementById('modeToggle');

        // Toggle Setup
        modeToggle.addEventListener('click', () => {
            isFixMode = !isFixMode;
            if (isFixMode) {
                modeToggle.innerText = 'Mode: Fix Mode';
                modeToggle.classList.replace('bg-blue-600', 'bg-red-600');
                modeToggle.classList.replace('border-blue-500', 'border-red-500');
            } else {
                modeToggle.innerText = 'Mode: Standard';
                modeToggle.classList.replace('bg-red-600', 'bg-blue-600');
                modeToggle.classList.replace('border-red-500', 'border-blue-500');
            }
        });

        function scrollToPart(id) {
            document.getElementById(id).scrollIntoView({
                behavior: 'smooth'
            });
        }

        // GENERATE SHEET DOM
        function createPart(part) {
            const section = document.createElement('section');
            section.id = part.id;
            section.className = 'part-section bg-white rounded-2xl shadow-sm border border-gray-200/80 overflow-hidden';

            const colorTheme = part.color === 'blue' ? 'text-blue-600' : 'text-indigo-600';

            section.innerHTML = `
                <!-- TITLE -->
                <div class="px-5 py-4 bg-gray-50/70 border-b border-gray-100 flex justify-between items-center">
                    <h2 class="text-base font-bold ${colorTheme}">${part.title}</h2>
                    <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-gray-200/60 text-gray-600">
                        Q${part.start} - Q${part.end}
                    </span>
                </div>
                <!-- LIST CONTAINER -->
                <div class="question-list divide-y divide-gray-100"></div>
            `;

            const container = section.querySelector('.question-list');

            for (let q = part.start; q <= part.end; q++) {
                const row = document.createElement('div');
                row.className = 'question-row flex items-center justify-between px-5 py-3 hover:bg-slate-50/50 transition-colors duration-100';

                // Number label
                const label = document.createElement('div');
                label.className = 'font-bold text-sm text-gray-400 w-8';
                label.innerText = String(q).padStart(2, '0');
                row.appendChild(label);

                // Target Grid Wrapper for input alignment
                const btnWrapper = document.createElement('div');
                btnWrapper.className = 'flex items-center gap-3 md:gap-5';

                part.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'answer-btn border border-gray-300 text-gray-600 bg-white shadow-sm';
                    btn.innerText = opt;

                    btn.addEventListener('click', () => {
                        const buttons = btnWrapper.querySelectorAll('button');

                        if (isFixMode) {
                            buttons.forEach(b => b.classList.remove('selected-fix'));
                            btn.classList.add('selected-fix');
                        } else {
                            buttons.forEach(b => b.classList.remove('selected-normal', 'selected-fix'));
                            btn.classList.add('selected-normal');
                        }
                    });

                    btnWrapper.appendChild(btn);
                });

                row.appendChild(btnWrapper);
                container.appendChild(row);
            }

            return section;
        }

        // RENDER IN DOM
        const main = document.getElementById('mainContainer');
        config.forEach(part => main.appendChild(createPart(part)));

        // EXPORT DOCUMENT HIGH FIDELITY AS MULTIPAGE PDF
        async function exportPDF() {
            const pdfElement = document.getElementById('pdfContent');

            try {
                const canvas = await html2canvas(pdfElement, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#f9fafb',
                    logging: false
                });

                const imgData = canvas.toDataURL('image/png');
                const {
                    jsPDF
                } = window.jspdf;

                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: 'a4'
                });

                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = pdf.internal.pageSize.getHeight();
                const imgWidth = pdfWidth;
                const imgHeight = (canvas.height * imgWidth) / canvas.width;

                let heightLeft = imgHeight;
                let position = 0;

                // Page Render Engine
                pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                heightLeft -= pdfHeight;

                while (heightLeft > 0) {
                    position = heightLeft - imgHeight;
                    pdf.addPage();
                    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                    heightLeft -= pdfHeight;
                }

                pdf.save(`TOEIC_Answers_${new Date().toISOString().slice(0,10)}.pdf`);
            } catch (error) {
                console.error("PDF engine crash safely caught: ", error);
            }
        }

        // SW REGISTRATION
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
            });
        }
    </script>
</body>

</html>
